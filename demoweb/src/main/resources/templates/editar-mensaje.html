<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar mensaje</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h2 class="mb-4">✏ Editar mensaje</h2>

  <form th:action="@{/mensaje/editar}" th:object="${mensaje}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Nombre/Correo (No editable)</label>
        <input type="text" 
               class="form-control" 
               th:value="${mensaje.nombre} + ' / ' + ${mensaje.correo}" 
               readonly>
    </div>

    <div class="mb-3">
        <label class="form-label">Mensaje</label>
        <textarea class="form-control"
                  th:field="*{mensaje}" 
                  rows="5"
                  required></textarea>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Guardar cambios</button>
    <a href="/mis-mensajes" class="btn btn-secondary mt-3">Cancelar</a>
  </form>

</body>
</html>
