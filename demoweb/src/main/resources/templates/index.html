<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modempres - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .hero {
      background: url('/img/porta-12.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
    }
    .search-box {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

<div th:replace="menu :: menu"></div>

<section class="hero">
  <div class="hero-content">

    <h1 class="display-4 fw-bold">Bienvenido a Modempres</h1>
    <p class="lead">Tu estilo, tu identidad. Descubre la moda que va contigo.</p>

    <!-- 🔥 UNA SOLA BARRA DE BÚSQUEDA -->
    <div class="search-box mt-4">
      <form class="row g-2" th:action="@{/buscar-producto}" method="get">
        <div class="col-md-5">
          <input type="text" class="form-control" name="color"
                 placeholder="¿Qué color buscas?">
        </div>
        <div class="col-md-5">
          <input type="text" class="form-control" name="marca"
                 placeholder="¿Qué marca buscas?">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-primary" type="submit">Buscar</button>
        </div>
      </form>
    </div>

  </div>
</section>

<!-- Tabla de resultados -->
<div class="container mt-5">
  <h2 class="mb-3">Resultados</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Color</th>
        <th>Marca</th>
        <th>Precio</th>
      </tr>
    </thead>

    <tbody>
      <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.color}"></td>
        <td th:text="${p.marca}"></td>
        <td th:text="${p.precio}"></td>
      </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
