<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis mensajes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h1 class="mb-4 text-center">📝 Mis mensajes enviados</h1>

  <div th:if="${mensajes.isEmpty()}">
    <div class="alert alert-info text-center">
        Aún no has enviado ningún mensaje.
    </div>
  </div>

<table class="table table-bordered table-hover" th:if="${!mensajes.isEmpty()}">
    <thead class="table-dark">
      <tr>
        <th>Mensaje</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="m : ${mensajes}">
        <td th:text="${m.mensaje}"></td>
        <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>

        <td>
          <a th:href="@{'/mensaje/editar/' + ${m.id}}"
		   class="btn btn-warning btn-sm">
		    Editar
		</a>

          <a th:href="@{'/mensaje/eliminar/' + ${m.id}}"
		   class="btn btn-danger btn-sm"
		   onclick="return confirm('¿Seguro que deseas eliminar este mensaje?');">
		    Eliminar
		</a>

        </td>

      </tr>
    </tbody>
</table>

  <a href="/" class="btn btn-secondary mt-3">Volver a la página principal</a>
</body>
</html>
