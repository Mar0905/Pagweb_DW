<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta | Modempres</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
		url('/img/ImagenLogin.jpg') center/cover no-repeat fixed;
	min-height: 100vh;
}

.register-wrapper {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 20px;
}

.register-card {
	background: rgba(255, 255, 255, 0.98);
	backdrop-filter: blur(10px);
	border-radius: 20px;
	box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
	overflow: hidden;
	max-width: 520px;
	width: 100%;
	border: 1px solid rgba(255, 255, 255, 0.2);
}

.register-header {
	background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
	padding: 40px 30px;
	text-align: center;
	color: white;
}

.register-header i {
	font-size: 70px;
	margin-bottom: 15px;
	opacity: 0.9;
}

.register-header h2 {
	margin: 0;
	font-weight: 600;
	font-size: 28px;
}

.register-header p {
	margin: 8px 0 0;
	opacity: 0.9;
	font-size: 14px;
}

.register-body {
	padding: 40px 35px;
}

.form-label {
	font-weight: 600;
	color: #2c3e50;
	margin-bottom: 8px;
	font-size: 14px;
}

.form-control {
	padding: 12px 15px;
	border: 2px solid #e0e0e0;
	border-radius: 10px;
	font-size: 15px;
	transition: all 0.3s ease;
}

.form-control:focus {
	border-color: #34495e;
	box-shadow: 0 0 0 0.2rem rgba(52, 73, 94, 0.15);
}

.btn-register {
	background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
	border: none;
	padding: 14px;
	font-size: 16px;
	font-weight: 600;
	border-radius: 10px;
	transition: all 0.3s ease;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}

.btn-register:hover {
	transform: translateY(-2px);
	background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
	box-shadow: 0 10px 25px rgba(52, 73, 94, 0.3);
}

.alert {
	border-radius: 10px;
	border: none;
	padding: 15px;
	display: flex;
	align-items: center;
	gap: 10px;
}

.alert-danger {
	background: #fee;
	color: #c33;
}

.divider {
	display: flex;
	align-items: center;
	text-align: center;
	margin: 25px 0;
	color: #95a5a6;
	font-size: 14px;
}

.divider::before, .divider::after {
	content: '';
	flex: 1;
	border-bottom: 1px solid #e0e0e0;
}

.divider span {
	padding: 0 15px;
}

.login-link {
	text-align: center;
	padding: 20px;
	background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
	border-radius: 12px;
	margin-top: 20px;
}

.login-link p {
	margin: 0 0 12px 0;
	color: #6c757d;
	font-size: 14px;
}

.btn-to-login {
	background: white;
	border: 2px solid #34495e;
	color: #34495e;
	padding: 12px 30px;
	font-size: 15px;
	font-weight: 600;
	border-radius: 10px;
	transition: all 0.3s ease;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	gap: 8px;
}

.btn-to-login:hover {
	background: #34495e;
	color: white;
	transform: translateY(-2px);
	box-shadow: 0 8px 20px rgba(52, 73, 94, 0.2);
}

.back-link {
	text-align: center;
	margin-top: 20px;
}

.back-link a {
	color: #34495e;
	text-decoration: none;
	font-weight: 600;
	transition: all 0.3s ease;
	display: inline-flex;
	align-items: center;
	gap: 5px;
}

.back-link a:hover {
	color: #2c3e50;
	gap: 8px;
}

.form-row {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 15px;
}

@media ( max-width : 576px) {
	.form-row {
		grid-template-columns: 1fr;
	}
}
</style>
</head>

<body>

	<div th:replace="~{menu :: menu}"></div>

	<div class="register-wrapper">
		<div class="register-card">
			<div class="register-header">
				<i class="bi bi-person-plus-fill"></i>
				<h2>Crear Cuenta</h2>
				<p>Únete a la comunidad Modempres</p>
			</div>

			<div class="register-body">
				<!-- Mensaje de error -->
				<div th:if="${error}" class="alert alert-danger mb-4">
					<i class="bi bi-exclamation-triangle-fill"></i> <span
						th:text="${error}"></span>
				</div>

				<form th:action="@{/registro}" method="post" th:object="${cliente}">

					<div class="mb-3">
						<label class="form-label"> <i class="bi bi-person"></i>
							Nombre
						</label> <input type="text" class="form-control" th:field="*{nombre}"
							placeholder="Ingresa tu numero" required />
					</div>

					<div class="mb-3">
						<label class="form-label"> <i class="bi bi-person"></i>
							Apellido
						</label> <input type="text" class="form-control" th:field="*{apellido}"
							placeholder="Ingresa tu apellido" required />
					</div>


					<div class="mb-3">
						<label class="form-label"> <i class="bi bi-envelope"></i>
							Correo Electrónico
						</label> <input type="email" class="form-control" th:field="*{email}"
							placeholder="Ingresa tu gmail" required />
					</div>

					<div class="mb-4">
						<label class="form-label"> <i class="bi bi-lock"></i>
							Contraseña
						</label> <input type="password" class="form-control"
							th:field="*{password}" placeholder="••••••••" required
							minlength="6" /> <small class="text-muted">Mínimo 6
							caracteres</small>
					</div>

					<button type="submit" class="btn btn-success btn-register w-100">
						<i class="bi bi-check-circle"></i> Crear mi cuenta
					</button>
				</form>

				<div class="divider">
					<span>O</span>
				</div>

				<!-- Link a inicio de sesión -->
				<div class="login-link">
					<p>
						<strong>¿Ya tienes cuenta?</strong>
					</p>
					<a th:href="@{/login}" class="btn-to-login"> <i
						class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
					</a>
				</div>

				<div class="back-link">
					<a th:href="@{/}"> <i class="bi bi-arrow-left"></i> Volver al
						inicio
					</a>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
