<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mensajes recibidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h1 class="mb-4 text-center">📬 Mensajes recibidos</h1>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Mensaje</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="c : ${mensajes}">
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.correo}"></td>
        <td th:text="${c.mensaje}"></td>
        <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></td>
      </tr>
    </tbody>
  </table>

  <a href="/" class="btn btn-secondary mt-3">Volver</a>
</body>
</html>
